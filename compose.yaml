name: mgo

services:
  app:
    image: ghcr.io/grayhex/mgo:${MGO_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      TRUST_PROXY: "1"
      MGO_LAN_MODE: "1"
      MGO_METADATA_GATEWAY: http://gateway:9090
      LIBRARY_ROOTS: /mnt/mgo-library
      FRAME_ENCODING: deflate
      SYMBIAN_AGENT_URL: http://mgo-symbian:8766
      SYMBIAN_AGENT_TOKEN_FILE: /symbian-auth/agent-token
    volumes:
      - ${MGO_DATA:-mgo-data}:/data
      - symbian-auth:/symbian-auth:ro
      - ${MGO_LIBRARY:-./games}:/mnt/mgo-library:rw
    networks: [internal, symbian]
    user: "${PUID:-10001}:${PGID:-10001}"
    group_add: ["10"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:size=128m,mode=1777,exec

  gateway:
    image: ghcr.io/grayhex/mgo-gateway:${MGO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${MGO_BIND:-0.0.0.0}:${MGO_PORT:-8080}:8080"
      - "${MGO_BIND:-0.0.0.0}:${MGO_HTTPS_PORT:-8443}:8443"
    environment:
      MGO_HTTPS_PORT: ${MGO_HTTPS_PORT:-8443}
      MGO_TLS_SAN: ${MGO_TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - ${MGO_TLS_CERTS:-mgo-tls}:/certs
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]

  mgo-symbian:
    image: ghcr.io/grayhex/mgo-symbian:${MGO_SYMBIAN_VERSION:-sha-494f03e}
    restart: unless-stopped
    environment:
      AGENT_TOKEN_FILE: /symbian-auth/agent-token
      MAX_FIRMWARE_BYTES: "2147483648"
    volumes:
      - mgo-symbian-data:/data
      - symbian-auth:/symbian-auth
      - ${SYMBIAN_INBOX:-./symbian-inbox}:/inbox:ro
    networks: [symbian]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 3g
    pids_limit: 512

networks:
  internal:
    internal: true
  edge: {}
  symbian:
    internal: true

volumes:
  mgo-tls:
  mgo-data:
  mgo-symbian-data:
  symbian-auth:
