# Fixed upstreams for the archive worker. Match the original URI to preserve encoded member names.
map $uri $moby_host {
  default "";
  ~^/mgo-moby/api/v2/(games|platforms)$ api.mobygames.com;
  ~^/mgo-moby/cdn/(covers|screenshots|images)/[a-zA-Z0-9_./%-]+$ cdn.mobygames.com;
  ~^/mgo-moby/www/(covers|screenshots|images)/[a-zA-Z0-9_./%-]+$ www.mobygames.com;
}
map $request_uri $archive_host {
  default "";
  "~^/j2me-archive/raw/toca-1/new-j2me-software-archive-search/[a-f0-9]{40}/data/(manifest\.json|mini/cli\.json\.gz|records/[0-9]{4}\.json\.gz)$" raw.githubusercontent.com;
  "~^/j2me-archive/pages/new-j2me-software-archive-search/(retrieval/v1/(manifest\.json|sha(1|256)/[0-9a-f]{1,2}\.json\.gz)|data/mini/cli\.json\.gz)$" toca-1.github.io;
  ~^/j2me-archive/ia/(metadata/96x65pixels_j2me|download/(96x65pixels_j2me/JARchive(Lite)?_v11\.7z|96x65pixels_j2me_mini/(%23|A-B|C-D|E-G|H-L|M-O|P-R|S|T-Z)\.7z/[a-zA-Z0-9_.~%-]+\.[jJ][aA][rR]))$ archive.org;
  "~^/j2me-archive/store/(?<archive_storage>ia[0-9]{4,8}\.us\.archive\.org)/[0-9]+/items/(96x65pixels_j2me/JARchive(Lite)?_v11\.7z|96x65pixels_j2me_mini/(%23|A-B|C-D|E-G|H-L|M-O|P-R|S|T-Z)\.7z/[a-zA-Z0-9_.~%-]+\.[jJ][aA][rR])$" $archive_storage;
}
map $request_uri $archive_path {
  default "";
  "~^/j2me-archive/(raw|pages|ia|store/ia[0-9]{4,8}\.us\.archive\.org)(?<archive_raw_path>/.*)$" $archive_raw_path;
}
map $archive_path $archive_bad_encoding {
  default 0;
  ~*^/[^?]*%(00|2e|2f|5c|25) 1;
}
map "$archive_path:$http_range" $archive_unbounded {
  default 0;
  "~JARchive(Lite)?_v11\.7z:bytes=[0-9]{1,12}-[0-9]{1,12}$" 0;
  ~JARchive(Lite)?_v11\.7z: 1;
}
map $request_uri $java_source_host {
  default "";
  ~^/java-sources/raw\.githubusercontent\.com/wakkatobakka/j2me-archive/main/data/catalog\.json$ raw.githubusercontent.com;
  ~^/java-sources/wakkatobakka\.github\.io/j2me-archive/data/catalog\.json$ wakkatobakka.github.io;
  ~*^/java-sources/www\.myabandonware\.com/(game/[a-z0-9-]+/?|media/screenshots/([a-z0-9_-]+/)+[a-z0-9_.-]+\.(png|jpe?g|webp|gif))$ www.myabandonware.com;
  ~*^/java-sources/myabandonware\.com/(game/[a-z0-9-]+/?|media/screenshots/([a-z0-9_-]+/)+[a-z0-9_.-]+\.(png|jpe?g|webp|gif))$ myabandonware.com;
  "~*^/java-sources/huggingface\.co/(api/datasets/M5-Dev/j2me-vault/tree/[a-f0-9]{40}/Games\?[A-Za-z0-9_=&%-]+|datasets/M5-Dev/j2me-vault/resolve/[a-f0-9]{40}/Games/[a-z0-9_.~%!()*'-]+\.jar|api/resolve-cache/datasets/M5-Dev/j2me-vault/[a-f0-9]{40}/Games%2f[a-z0-9_.~%!()*'-]+\.jar(\?.*)?)$" huggingface.co;
  "~^/java-sources/(?<vault_cdn>([a-z]+\.aws\.cdn\.hf\.co|cas-bridge\.xethub\.hf\.co))/xet-bridge-[a-z]+/[a-f0-9]{24}/[a-f0-9]{64}\?.+$" $vault_cdn;
  ~^/java-sources/(?<vault_lfs>cdn-lfs(-[a-z0-9]+)?\.huggingface\.co)/repos/[a-zA-Z0-9/_-]+\?.+$ $vault_lfs;
}
map $request_uri $java_source_path {
  default "";
  ~^/java-sources/[a-z0-9.-]+(?<java_raw_path>/.*)$ $java_raw_path;
}

# Metadata and MGO runtime releases only: never a general-purpose forward proxy. Not published.
server {
  listen 9090;
  server_name _;
  resolver 127.0.0.11 valid=60s ipv6=off;
  resolver_timeout 8s;
  proxy_ssl_verify_depth 4;
  location ~ ^/(n-gage-games/original/(item/[a-z0-9-]+\.php)?|images/ngage/[a-zA-Z0-9_./-]+)$ {
    limit_except GET { deny all; }
    set $aas_host allaboutsymbian.com;
    proxy_pass https://$aas_host$request_uri;
    proxy_ssl_name allaboutsymbian.com;
    proxy_set_header Host allaboutsymbian.com;
    proxy_set_header User-Agent "MGO metadata/1.5";
    proxy_intercept_errors on;
    error_page 502 503 504 = @aas_www;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
  }
  location ~ ^/mgo-aas-www/(n-gage-games/original/(item/[a-z0-9-]+\.php)?|images/ngage/[a-zA-Z0-9_./-]+)$ {
    limit_except GET { deny all; }
    set $aas_www www.allaboutsymbian.com;
    rewrite ^/mgo-aas-www(/.*)$ $1 break;
    proxy_pass https://$aas_www;
    proxy_set_header Host $aas_www;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 15s;
  }
  location @aas_www {
    set $aas_www www.allaboutsymbian.com;
    proxy_pass https://$aas_www$request_uri;
    proxy_set_header Host $aas_www;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 15s;
  }
  location ~ ^/mgo-launchbox(?<launchbox_path>/platforms/games/213-nokia-n-gage|/games/images/[0-9]+-[a-z0-9-]+)$ {
    limit_except GET { deny all; }
    set $launchbox gamesdb.launchbox-app.com;
    proxy_pass https://$launchbox$launchbox_path;
    proxy_set_header Host $launchbox;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 10s;
  }
  location ~ "^/mgo-launchbox-images/(?<cover_id>[a-f0-9-]{36}\.(?:png|jpe?g|webp))$" {
    limit_except GET { deny all; }
    set $launchbox_cdn images.launchbox-app.com;
    proxy_pass https://$launchbox_cdn/$cover_id;
    proxy_set_header Host $launchbox_cdn;
    proxy_set_header Referer https://gamesdb.launchbox-app.com/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 10s;
  }
  location = /mgo-updates/latest {
    limit_except GET { deny all; }
    set $mgo_api api.github.com;
    proxy_pass https://$mgo_api/repos/grayhex/MGO/releases/latest;
    proxy_set_header Host api.github.com;
    proxy_set_header User-Agent MGO-runtime-update;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
  }
  location ~ ^/mgo-updates/download/v?[0-9]+\.[0-9]+\.[0-9]+/mgo-kemulator-v[0-9]+\.[0-9]+(\.[0-9]+)?-bridge1-linux-amd64\.zip$ {
    limit_except GET { deny all; }
    set $mgo_github github.com;
    rewrite ^/mgo-updates/download/(.*)$ /grayhex/MGO/releases/download/$1? break;
    proxy_pass https://$mgo_github;
    proxy_set_header Host github.com;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
    proxy_intercept_errors on;
    error_page 302 = @mgo_runtime_asset;
  }
  location @mgo_runtime_asset {
    set $mgo_asset $upstream_http_location;
    if ($mgo_asset !~ ^https://release-assets\.githubusercontent\.com/github-production-release-asset[-/]) { return 502; }
    proxy_pass $mgo_asset;
    proxy_set_header Host release-assets.githubusercontent.com;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }
  location ^~ /mgo-moby/ {
    access_log off;
    error_log /dev/null crit;
    limit_except GET { deny all; }
    if ($moby_host = "") { return 404; }
    rewrite ^/mgo-moby/(api|cdn|www)(/.*)$ $2 break;
    proxy_pass https://$moby_host;
    proxy_set_header Host $moby_host;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 15s;
    proxy_redirect off;
  }
  location ^~ /j2me-archive/ {
    limit_except GET { deny all; }
    if ($archive_host = "") { return 404; }
    if ($archive_bad_encoding) { return 400; }
    if ($archive_unbounded) { return 416; }
    proxy_pass https://$archive_host$archive_path;
    proxy_set_header Host $archive_host;
    proxy_set_header Range $http_range;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 45s;
    proxy_buffering off;
    proxy_redirect off;
  }
  location ^~ /java-sources/ {
    limit_except GET { deny all; }
    access_log off;
    if ($java_source_host = "") { return 404; }
    proxy_pass https://$java_source_host$java_source_path;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $java_source_host;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 6s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_redirect off;
  }
  location / { return 404; }
}
